name: lab
run-name: "lab ${{ inputs.tag }}"

# One job per chunk. Each job downloads the sealed package from the fixed release, checks its sha256, unseals
# it, verifies every file against the manifest, runs its chunk and uploads its sealed output. Inputs reach the
# shell only through environment variables. No concurrency group: nothing cancels anything.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "opaque run tag"
        required: true
      asset:
        description: "release asset name"
        required: true
      asset_sha256:
        description: "sha256 of the asset"
        required: true
      tree:
        description: "manifest tree hash"
        required: true
      chunks:
        description: "JSON list of chunk numbers, e.g. [1,2,3]"
        required: true
      max_parallel:
        description: "jobs at once"
        required: true
      timeout_min:
        description: "minutes per job"
        required: true
      retention_days:
        description: "artifact retention"
        default: "14"

permissions:
  contents: read

jobs:
  trozo:
    name: trozo (${{ matrix.k }})
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ fromJSON(inputs.timeout_min) }}
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.max_parallel) }}
      matrix:
        k: ${{ fromJSON(inputs.chunks) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          sparse-checkout: |
            tools/banco_trozo.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Tools
        run: python -m pip install -q cryptography==46.0.3
      - name: Download
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET: ${{ inputs.asset }}
        run: gh release download banco -p "$ASSET" -D in -R "$GITHUB_REPOSITORY"
      - name: Run
        env:
          PAYLOAD_KEY: ${{ secrets.PAYLOAD_KEY }}
          ASSET: ${{ inputs.asset }}
          ASSET_SHA256: ${{ inputs.asset_sha256 }}
          TREE: ${{ inputs.tree }}
          CHUNK: ${{ matrix.k }}
          TIMEOUT_MIN: ${{ inputs.timeout_min }}
        run: python tools/banco_trozo.py
      - name: Upload
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: t-${{ matrix.k }}
          path: out/t-${{ matrix.k }}.bin
          retention-days: ${{ fromJSON(inputs.retention_days) }}
          if-no-files-found: error
